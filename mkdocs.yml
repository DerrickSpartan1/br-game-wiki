site_name: Battle Royale Game Wiki
site_description: Design wiki for a PC battle royale inspired by 2018 PUBG, with a gun and ammo pool that changes every match.
site_url: https://derrickspartan1.github.io/br-game-wiki/
repo_url: https://github.com/DerrickSpartan1/br-game-wiki
repo_name: br-game-wiki
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    logo: material/crosshairs
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - toc.follow

plugins:
  - search

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - attr_list
  - pymdownx.superfences

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

